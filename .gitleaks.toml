title = "greatfallstoolbus.org gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Template and example files may contain documented placeholder values."
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/).*\.example\.(json|ya?ml|toml|env|txt)$''',
  '''(^|/).*\.template$''',
  '''(^|/).*\.sample$''',
]

[[allowlists]]
description = "Known non-secret infrastructure literals."
regexTarget = "line"
regexes = [
  '''/nix/store/[a-z0-9]{32}-''',
  '''age1[a-z0-9]{58}''',
  '''\{\{\s*vault_[A-Za-z0-9_]+''',
  '''vault_[A-Za-z0-9_]+\s*[:=]\s*["']?\{\{''',
  '''\$2[ayb]\$10\$placeholder''',
]

[[rules]]
id = "tinyland-cloudflare-api-token"
description = "Cloudflare API token with cfat_ prefix"
regex = '''cfat_[A-Za-z0-9]{40,}'''
keywords = ["cfat_"]
tags = ["cloudflare", "tinyland"]

[[rules]]
id = "tinyland-porkbun-api-key"
description = "Porkbun API key with pk1_ or sk1_ prefix"
regex = '''(pk1|sk1)_[A-Za-z0-9]{60,}'''
keywords = ["pk1_", "sk1_"]
tags = ["porkbun", "tinyland"]

[[rules]]
id = "tinyland-age-secret-key"
description = "age secret key"
regex = '''AGE-SECRET-KEY-1[A-Z0-9]{58,}'''
keywords = ["AGE-SECRET-KEY-1"]
tags = ["age", "sops", "tinyland"]

[[rules]]
id = "tinyland-tailscale-auth-key"
description = "Tailscale auth, API, or client key"
regex = '''tskey-(auth|api|client)-[A-Za-z0-9-]{40,}'''
keywords = ["tskey-"]
tags = ["tailscale", "tinyland"]

# --- GFTB naming-consent rules (TIN-2360 naming-consent.md) ----------------
# Independent backstop for src/lib/naming-consent.ts: this public repo may
# name a person only in the exact public form the (private) naming-consent
# record permits. These two rows are the highest-consequence to get wrong,
# so they are enforced here too, not only in application code. Rule
# descriptions deliberately do NOT spell out the names themselves (a scan
# report should not be the thing that republishes what it is redacting), and
# this file is allowlisted below so its own regex definitions can never
# self-match.

[[rules]]
id = "gftb-naming-consent-bus-host-full-name"
description = "Bus host has a public-consent row for the initial only; the unredacted first name must never appear in this public repo"
regex = '''(?i)\bjosh\b'''
keywords = ["josh"]
tags = ["gftb", "naming-consent", "private-identity"]
[rules.allowlist]
description = "This config file's own rule definition, and the naming-consent enforcement module + its tests, legitimately contain the bare keyword — that IS the denylist."
paths = ['''(^|/)\.gitleaks\.toml$''', '''(^|/)src/lib/naming-consent\.ts$''', '''(^|/)src/lib/naming-consent\.test\.ts$''']

[[rules]]
id = "gftb-naming-consent-private-only-identity"
description = "A naming-consent.md identity has NO public form at all; any reference (name or list-membership proof) must never appear in this public repo"
regex = '''(?i)\bwalter\b'''
keywords = ["walter"]
tags = ["gftb", "naming-consent", "private-identity"]
[rules.allowlist]
description = "This config file's own rule definition, and the naming-consent enforcement module + its tests, legitimately contain the bare keyword — that IS the denylist."
paths = ['''(^|/)\.gitleaks\.toml$''', '''(^|/)src/lib/naming-consent\.ts$''', '''(^|/)src/lib/naming-consent\.test\.ts$''']
