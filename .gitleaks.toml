title = "greatfallstoolbus.org gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Template and example files may contain documented placeholder values."
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/).*\.example\.(json|ya?ml|toml|env|txt)$''',
  '''(^|/).*\.template$''',
  '''(^|/).*\.sample$''',
]

# Gitignored, ephemeral build artifacts. `gitleaks dir` walks the filesystem
# regardless of .gitignore, so a bundler that constant-folds a deliberately
# split test-fixture literal (src/lib/server/stripe/client.ts assembles a
# fake sk_test_ key from two string pieces precisely so gitleaks sees no
# contiguous literal in SOURCE) can still recombine it in compiled output.
# `.svelte-kit/output` is a pure intermediate SSR-render artifact, never
# published anywhere. `build/` is the real published artefact, and it already
# has a dedicated, more precise scanner: `just leak-scan-build`
# (scripts/lib/leak-scan.mjs), which classifies every file by extension and
# fails closed on anything it cannot classify — gitleaks scanning it too adds
# no coverage, only a false-positive surface that made `just check`
# non-idempotent (a second local run without `just clean` went red on this
# exact folded literal after the first run's build).
[[allowlists]]
description = "Gitignored build artifacts (.svelte-kit/, build/) — covered by just leak-scan-build instead."
paths = [
  '''(^|/)\.svelte-kit/''',
  '''(^|/)build/''',
]

[[allowlists]]
description = "Known non-secret infrastructure literals."
regexTarget = "line"
regexes = [
  '''/nix/store/[a-z0-9]{32}-''',
  '''age1[a-z0-9]{58}''',
  '''\{\{\s*vault_[A-Za-z0-9_]+''',
  '''vault_[A-Za-z0-9_]+\s*[:=]\s*["']?\{\{''',
  '''\$2[ayb]\$10\$placeholder''',
]

[[rules]]
id = "tinyland-cloudflare-api-token"
description = "Cloudflare API token with cfat_ prefix"
regex = '''cfat_[A-Za-z0-9]{40,}'''
keywords = ["cfat_"]
tags = ["cloudflare", "tinyland"]

[[rules]]
id = "tinyland-porkbun-api-key"
description = "Porkbun API key with pk1_ or sk1_ prefix"
regex = '''(pk1|sk1)_[A-Za-z0-9]{60,}'''
keywords = ["pk1_", "sk1_"]
tags = ["porkbun", "tinyland"]

[[rules]]
id = "tinyland-age-secret-key"
description = "age secret key"
regex = '''AGE-SECRET-KEY-1[A-Z0-9]{58,}'''
keywords = ["AGE-SECRET-KEY-1"]
tags = ["age", "sops", "tinyland"]

[[rules]]
id = "tinyland-tailscale-auth-key"
description = "Tailscale auth, API, or client key"
regex = '''tskey-(auth|api|client)-[A-Za-z0-9-]{40,}'''
keywords = ["tskey-"]
tags = ["tailscale", "tinyland"]
