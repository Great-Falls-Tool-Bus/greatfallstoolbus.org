# Build + push the on-cluster container image to GHCR (TIN-2543).
#
# ACTIVE, BUILD-AND-PUBLISH ONLY. Produces a real adapter-node OCI image on every
# push to main and on demand via workflow_dispatch so the on-cluster serve path
# has a concrete artifact to consume:
#
#   * A push to main builds and publishes the image. That is the end of this
#     workflow's authority: it does NOT deploy and does NOT signal a deploy.
#   * TIN-3899 retired the `signal-cd` job, which resolved the pushed @sha256
#     digest and fired a `repository_dispatch` (`web-image-published`) at
#     great-falls-tool-bus-infra so its web-stack.yml would apply it. The
#     receiving workflow is deleted; the gftb-site static origin is now promoted
#     in place by an attended, reviewed release chain in the overlay. Nothing in
#     this public repo triggers a production deploy any more, and no
#     INFRA_CD_DISPATCH_TOKEN is consumed.
#   * The production host is the on-cluster service behind Cloudflare Access
#     (ADR 0010). Cloudflare Pages is retired.
#   * The default `just build` / static pipeline still emits adapter-static.
#     Only ADAPTER=node (set by the image recipe) selects adapter-node.
#   * The image is consumed by great-falls-tool-bus-infra (blahaj), which owns
#     DNS, Access, Tunnel, and any actual deploy/cutover. This repo never holds
#     edge/apply creds and never flips the live host.
#
# RUNNER CLASS (TIN-2543 fix): GFTB's ARC pool advertises only the shared
# `tinyland-nix` GloriousFlywheel runner — there is NO `tinyland-dind`/buildx
# runner in this org, so the previous `runs-on: tinyland-dind` had no runner and
# the image build could never start. This workflow now mirrors the
# great-falls-tool-bus-infra *-crs.yml pattern EXACTLY: it runs on `tinyland-nix`
# through ./GloriousFlywheel/.github/actions/nix-job and builds the OCI image
# DAEMONLESS via nix2container (flake `.#image` -> the n2c-patched skopeo
# copyToRegistry; nix/oci-image.nix stays the nixpkgs-only fallback). No Docker
# daemon, no buildx. The GloriousFlywheel shared cache
# accelerates the SvelteKit build inputs; the image push itself is NOT
# remote-execution eligible (`container-image-and-push` is blocked at the GF
# manifest layer — see docs/CI-SCHEMA.md §4 and the flywheel skill's rule 8).
#
# CREDENTIALS (public-repo-safe): no cache/executor endpoint, token, or UUID is
# committed. GloriousFlywheel is PRIVATE again (2026-08 GF-RBE contraction), so
# the "public GF core, no cross-repo credential" premise of 632b714 no longer
# holds: the GF core is checked out at the exact GF_CORE_REF with the
# read-only deploy key GF_CORE_DEPLOY_KEY (the GF enrollment doc's preferred
# narrow consumer credential; the same idiom this workflow used before the
# 2026-07-25 public window). The key is referenced by NAME only and never
# lands in the tree. The image push uses only the ambient GITHUB_TOKEN
# (packages: write) — no other secret.

name: Build Container (GHCR)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/container-ghcr.yml'

concurrency:
  group: container-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GF_CORE_REF: 2281b576bce0e8dd776a047b84e7464f5b508a62

jobs:
  verify-public-gf-core:
    name: Verify exact pinned GF core checkout
    if: github.event_name == 'pull_request'
    runs-on: tinyland-nix
    permissions:
      contents: read
    steps:
      - name: Checkout pinned GloriousFlywheel core (read-only deploy key)
        uses: actions/checkout@v7
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          ssh-key: ${{ secrets.GF_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Assert exact checkout
        run: |
          set -euo pipefail
          actual="$(git -C GloriousFlywheel rev-parse HEAD)"
          if [[ "${actual}" != "${GF_CORE_REF}" ]]; then
            echo "::error::GloriousFlywheel checkout drift: expected ${GF_CORE_REF}, got ${actual}"
            exit 1
          fi
          echo "Verified pinned GloriousFlywheel core at ${actual}"

  build-push:
    name: Build + push adapter-node image (daemonless nix)
    if: github.event_name != 'pull_request'
    runs-on: tinyland-nix
    permissions:
      contents: read
      packages: write
    outputs:
      # 'true' only after the image build + push action succeeds. Retained as a
      # machine-readable publication marker for operators and for any future
      # reviewed consumer; TIN-3899 removed the signal-cd job that used to gate
      # a deploy on it, so nothing downstream reads it inside this repository.
      published: ${{ steps.publish.outputs.published }}
      # Written by skopeo during the registry copy, not reconstructed later
      # from a mutable tag or a second registry lookup.
      digest: ${{ steps.image.outputs.digest }}
      immutable_ref: ${{ steps.image.outputs.immutable_ref }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v7
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout pinned GloriousFlywheel core (read-only deploy key)
        uses: actions/checkout@v7
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: ${{ env.GF_CORE_REF }}
          path: GloriousFlywheel
          ssh-key: ${{ secrets.GF_CORE_DEPLOY_KEY }}
          persist-credentials: false
      # R331: retire the private-GF-coupled nix-job wrapper in favor of the
      # public tinyland-inc/ci-templates nix-setup action, pinned to the
      # v3.1.0 release commit, for Nix bootstrap + cache-hint detection on
      # this self-hosted tinyland-nix runner. The pinned GloriousFlywheel
      # core checkout above is UNCHANGED: `just container-image-publish`
      # below still runs inside GF's `#ci` flake devShell (nix2container +
      # skopeo toolchain), and no equivalent recipe exists outside it in
      # either this repo or GloriousFlywheel's own top-level justfile — an
      # attempt to fully decouple the build recipe itself was not made here
      # without a verified portable replacement.
      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Build + push adapter-node image
        id: image
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/greatfallstoolbus.org
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BUILD_COMMIT_REF: ${{ github.ref_name }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          IMAGE_DIGEST_FILE: ${{ runner.temp }}/greatfallstoolbus.org-${{ github.sha }}.digest
        run: |
          set -euo pipefail
          if [[ -e "${IMAGE_DIGEST_FILE}" ]]; then
            echo "::error::refusing pre-existing digest carrier: ${IMAGE_DIGEST_FILE}"
            exit 1
          fi
          cd overlay
          export GF_CORE_PATH=../GloriousFlywheel
          export GF_CORE_CI_PATH=../GloriousFlywheel#ci
          nix develop ../GloriousFlywheel#ci -c just container-image-publish
          digest="$(tr -d '\\r\\n' < "${IMAGE_DIGEST_FILE}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::publisher returned an invalid image digest: ${digest}"
            exit 1
          fi
          image_ref="$(printf '%s' "${IMAGE_REF}" | tr '[:upper:]' '[:lower:]')"
          immutable_ref="${image_ref}@${digest}"
          {
            echo "digest=${digest}"
            echo "immutable_ref=${immutable_ref}"
            echo "digest_file=${IMAGE_DIGEST_FILE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Published immutable image ${immutable_ref}"

      - name: Upload immutable publisher digest carrier
        uses: actions/upload-artifact@v4
        with:
          name: greatfallstoolbus-org-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.image.outputs.digest_file }}
          if-no-files-found: error

      - name: Record successful image publication
        id: publish
        run: echo "published=true" >> "$GITHUB_OUTPUT"
