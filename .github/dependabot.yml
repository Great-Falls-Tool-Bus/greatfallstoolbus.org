version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 10
    ignore:
      # Launch toolchain pins are deliberate; major upgrades need a ticketed proof.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # drizzle-orm is hard-pinned to 0.39.3 because the BCR-only
      # tummycrypt_tinyland_auth_pg@0.2.4 graph declares that exact runtime
      # dependency. Bumping only this third-party Node edge would split the
      # application from the adapter contract; move it only with the BCR module.
      # No update-types filter: these bumps arrive as semver-minor, which a
      # majors-only entry would not catch.
      - dependency-name: 'drizzle-orm'
      # drizzle-kit travels with drizzle-orm: migrations.test.ts hard-asserts the literal
      # '^0.30.5' range, so a minor bump turns that gate red on its own.
      - dependency-name: 'drizzle-kit'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # @skeletonlabs/skeleton + @skeletonlabs/skeleton-svelte are a
      # version-locked PAIR (skeleton-common component CSS @applies brand
      # presets only core defines): a solo bump of either package always
      # breaks — that is exactly what failed in #202/#203, resolved by the
      # paired 5.0.1 bump. Dependabot bumps one package at a time, so major
      # bumps stay ignored and land as hand-rolled paired PRs; minor/patch
      # bumps within 5.x still flow through (grouped, so the pair travels
      # together).
      - dependency-name: '@skeletonlabs/skeleton'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@skeletonlabs/skeleton-svelte'
        update-types:
          - 'version-update:semver-major'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
