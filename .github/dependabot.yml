version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 10
    ignore:
      # Launch toolchain pins are deliberate; major upgrades need a ticketed proof.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # drizzle-orm is hard-pinned to 0.39.3 because @tummycrypt/tinyland-auth-pg@0.2.4
      # declares it as an exact dependency. Bumping it here does not upgrade the copy the
      # auth adapter executes against — pnpm installs a SECOND physical copy and the
      # adapter keeps resolving 0.39.3 — so the bump closes no advisory while adding a
      # duplicate. No update-types filter: the bumps arrive as semver-minor, which a
      # majors-only entry would not catch. Revisit when auth-pg ships a release that
      # moves its own pin (tracked: the drizzle advisory is unfixable downstream until
      # then, and residual exploitability is low — production source has no
      # sql.identifier or $dynamic call sites).
      - dependency-name: 'drizzle-orm'
      # drizzle-kit travels with drizzle-orm: migrations.test.ts hard-asserts the literal
      # '^0.30.5' range, so a minor bump turns that gate red on its own.
      - dependency-name: 'drizzle-kit'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # @skeletonlabs/skeleton + @skeletonlabs/skeleton-svelte are a
      # version-locked PAIR (skeleton-common component CSS @applies brand
      # presets only core defines): a solo bump of either package always
      # breaks — that is exactly what failed in #202/#203, resolved by the
      # paired 5.0.1 bump. Dependabot bumps one package at a time, so major
      # bumps stay ignored and land as hand-rolled paired PRs; minor/patch
      # bumps within 5.x still flow through (grouped, so the pair travels
      # together).
      - dependency-name: '@skeletonlabs/skeleton'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@skeletonlabs/skeleton-svelte'
        update-types:
          - 'version-update:semver-major'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
